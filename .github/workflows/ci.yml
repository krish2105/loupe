name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js drops Node 20; the local machine still runs
          # it, so CI holds the line at the version we will have to move to.
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loupe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loupe_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The watch-event and resume tests run against a real database. They skip
      # without one, and a silently skipped test proves nothing.
      - name: Apply migrations
        run: ./db/migrate.sh
      - run: uv sync --all-groups
        working-directory: services/api
      - run: uv run ruff check .
        working-directory: services/api
      - run: uv run pytest -q
        working-directory: services/api

  media:
    name: Media
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/media
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest -q

  ai:
    name: AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Without the embeddings extra, so CI does not pull a gigabyte of torch.
      # Retrieval, refusal, citation selection and summarising are all pure and
      # need no model.
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest -q

  eval:
    name: Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      # Metrics and the golden-set contract are pure. The scoring run itself
      # needs a live AI service and is not part of CI — a benchmark that only
      # ever runs in CI is a benchmark nobody reads.
      - run: uv run pytest -q

  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loupe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loupe_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: ./db/migrate.sh
      - run: uv sync --all-groups
        working-directory: services/pipeline
      - run: uv run ruff check .
        working-directory: services/pipeline
      # The Phase 5 gate is "the stage machine survives forced failure
      # injection". These tests inject failures at every stage against a real
      # database rather than mocking the machine, so they need one.
      - run: uv run pytest -q
        working-directory: services/pipeline

  ingest:
    name: Ingest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loupe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loupe_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: ./db/migrate.sh
      - run: uv sync --all-groups
        working-directory: services/ingest
      - run: uv run ruff check .
        working-directory: services/ingest
      - run: uv run pytest -q
        working-directory: services/ingest

      # The Phase 4 gate is a number, so CI asserts the number rather than
      # trusting that a run which exited zero did anything.
      - name: Sync reaches the Phase 4 gate
        working-directory: services/ingest
        run: uv run python -m app.run
      - name: 1,500+ Class B videos are in the index
        run: |
          count=$(psql "$DATABASE_URL" -t -A -c \
            "SELECT count(*) FROM videos WHERE source_class='referenced'")
          echo "referenced videos: $count"
          [ "$count" -ge 1500 ] || { echo "below the Phase 4 gate"; exit 1; }

      # §5: idempotent, safe to re-run at any time. A second run must insert
      # nothing — otherwise a retried cron job silently duplicates the catalogue.
      - name: Re-running inserts nothing
        working-directory: services/ingest
        run: |
          before=$(psql "$DATABASE_URL" -t -A -c "SELECT count(*) FROM videos")
          uv run python -m app.run
          after=$(psql "$DATABASE_URL" -t -A -c "SELECT count(*) FROM videos")
          echo "before=$before after=$after"
          [ "$before" = "$after" ] || { echo "sync is not idempotent"; exit 1; }

      # §4.2 rule 2: consumption is logged per run, so there is something to
      # check. An empty ledger after two runs means the accounting is not wired.
      - name: The quota ledger recorded the spend
        run: |
          units=$(psql "$DATABASE_URL" -t -A -c \
            "SELECT COALESCE(sum(units_spent),0) FROM ingest_quota_ledger")
          echo "units spent: $units"
          [ "$units" -gt 0 ] || { echo "quota ledger is empty"; exit 1; }

  schema:
    name: Schema
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's own image, so the extension version matches local.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loupe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loupe_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: ./db/migrate.sh
      - name: Migrations are idempotent
        # Re-running must be a no-op. §5.1 makes idempotency an architectural
        # rule; a migration runner that breaks on second run contradicts it.
        run: ./db/migrate.sh
      - name: Seed applies
        # The seed is how anyone gets a browsable catalogue locally, so a
        # broken one blocks every new contributor on their first afternoon.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/0001_demo_catalogue.sql
      - name: Seed is idempotent
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/0001_demo_catalogue.sql
      - name: Constraint tests
        # Fails the build if any PASS line is missing or any FAIL appears.
        run: |
          output=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --quiet --no-psqlrc \
            -f db/tests/constraints.sql 2>&1)
          echo "$output"
          echo "$output" | grep -q "FAIL" && exit 1
          count=$(echo "$output" | grep -c "PASS")
          echo "$count constraint assertions passed"
          [ "$count" -ge 19 ] || { echo "expected at least 19 assertions"; exit 1; }
