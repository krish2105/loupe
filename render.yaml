# Render Blueprint — the API and workers.
#
# §14 puts the web app on Vercel and everything long-running on Render or Fly,
# because the pipeline and the ingest worker are processes rather than request
# handlers and do not fit a serverless model.
#
# Five things are true about this file and worth stating before the YAML.
#
# The two batch jobs are not here. Render has no free plan for cron jobs — the
# Blueprint is rejected outright with "free not a valid plan for service type
# cron" — so the nightly ingest and the pipeline run from
# .github/workflows/scheduled.yml instead, which is free on a public repository
# and needs nothing but DATABASE_URL. Moving them to a paid Render plan is a
# two-line change and about $2 a month; see docs/deploying.md.
#
# That is a smaller compromise than it looks. §14 puts workers on Render because
# "long-running processes required, so not serverless" — but these two are
# batches that start, claim whatever is eligible, and exit. The pipeline is
# resumable and idempotent by design (§10.1), so where it runs from matters much
# less than that it runs at all.
#
# services/auth is deliberately absent. It is a development identity provider
# (ADR 0004) and it refuses to start unless ENVIRONMENT=local, so deploying it
# would produce a service that crash-loops. That is the intended outcome, but
# the honest version is not to list it at all.
#
# Every secret is `sync: false`, which is Render's way of saying "prompt the
# operator, never store it here". §14: nothing in the repository, ever.
#
# The database is not defined here. It is Supabase Postgres, because the app
# needs pgvector and the same instance backs Supabase Auth. Render's own
# Postgres has no pgvector on the free tier.
#
# Free instances sleep after inactivity and take a few seconds to wake. That is
# fine for everything here except a demo, and it is the reason the cost line in
# the README says $0–7 rather than $0.
#
# `region` must be the one nearest the Supabase project, and it is set here for
# a project in ap-southeast-2. Every request this API serves makes several
# database round trips, so a service on the wrong continent pays that latency
# several times over on every page. Render offers oregon, ohio, virginia,
# frankfurt and singapore; pick whichever is closest to the database and change
# it in all three services together.

services:
  # ------------------------------------------------------------ core API ----
  - type: web
    name: loupe-api
    runtime: python
    plan: free
    region: singapore
    rootDir: services/api
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      # The pooler URL, not the direct one. Render's free instances open a new
      # connection per cold start and Supabase's direct limit is small.
      - key: DATABASE_URL
        sync: false
      # Supabase → Project Settings → API → JWT Secret. The API verifies access
      # tokens with this locally, so a progress write every ten seconds costs no
      # round trip.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # The deployed web origin. Without it every browser call fails preflight,
      # which is exactly how Phase 2 through Phase 5 shipped with no CORS at all
      # and passing server-side tests.
      - key: CORS_ORIGINS
        sync: false
      # Filled by hand with the AI service's URL, e.g.
      # https://loupe-ai.onrender.com. Render can wire this from another
      # service, but only as `host:port` with no scheme, and the API builds a
      # URL from it — so a declarative link here produces a value that looks
      # right and does not resolve.
      - key: AI_SERVICE_URL
        sync: false

  # -------------------------------------------------------------- AI ---------
  # The only service that holds a model key or contains a prompt (§5).
  - type: web
    name: loupe-ai
    runtime: python
    plan: free
    region: singapore
    rootDir: services/ai
    # The embedding model is ~2GB and does not fit a free instance's disk or
    # memory. Deployed without it, retrieval falls back to the deterministic
    # embedder and semantic search degrades to keyword — which the API reports
    # in its `mode` field rather than hiding. Set USE_REAL_EMBEDDINGS=true and
    # move to a paid instance to change that.
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: USE_REAL_EMBEDDINGS
        value: "false"
      # Optional. Absent, answers are extractive: every sentence is one the
      # speaker actually said, which is a defensible baseline rather than a
      # degraded mode.
      - key: GEMINI_API_KEY
        sync: false

  # ------------------------------------------------------------- media -------
  # The sole holder of provider credentials (§5). Nothing else has ever seen a
  # Bunny key, and this deployment is what keeps that true.
  - type: web
    name: loupe-media
    runtime: python
    plan: free
    region: singapore
    rootDir: services/media
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: BUNNY_LIBRARY_ID
        sync: false
      - key: BUNNY_API_KEY
        sync: false
      - key: BUNNY_PULL_ZONE
        sync: false
      # Signs playback URLs. Separate from the API key on purpose: one signs
      # management calls, the other signs what the public fetches.
      - key: BUNNY_TOKEN_KEY
        sync: false
      # Bunny does not sign Stream webhooks, so the endpoint sits behind an
      # unguessable path segment. openssl rand -hex 32
      - key: WEBHOOK_SECRET
        sync: false
