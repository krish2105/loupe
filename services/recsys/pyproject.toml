[project]
name = "loupe-recsys"
version = "0.1.0"
description = "Loupe recommender — candidate generation, ranking, offline evaluation"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# §12.1's content-similarity neighbours come from content embeddings. Optional
# because the metrics, personas, candidate generation and ranking are all
# testable without a model.
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
