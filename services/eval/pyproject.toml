[project]
name = "loupe-eval"
version = "0.1.0"
description = "Loupe evaluation — golden set, metrics, published results"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
